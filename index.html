<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HurufReader</title>
  <link rel="stylesheet" href="./node_modules/pdfjs-dist/web/pdf_viewer.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #525659;
    }
    #viewerContainer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: auto;
    }
    #emptyState {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #d1d5db;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      user-select: none;
      pointer-events: none;
    }
    #emptyState h2 {
      margin: 0 0 8px 0;
      font-weight: 500;
      font-size: 20px;
    }
    #emptyState p {
      margin: 0;
      font-size: 14px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div id="viewerContainer" class="pdfViewerContainer">
    <div id="viewer" class="pdfViewer"></div>
  </div>
  <div id="emptyState">
    <h2>HurufReader</h2>
    <p>Press Ctrl+O or use File &gt; Open to open a PDF</p>
  </div>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
